name = "overnight-suggestions"
main = "index.js"
compatibility_date = "2026-10-01"

[vars]
INBOX_REPO = "Poffel5657/overnight-inbox"

# Geheim per `wrangler secret put`: GITHUB_TOKEN, TURNSTILE_SECRET

[[ratelimits]]
name = "LIMIT_PER_PERSON"
namespace_id = "1001"
simple = { limit = 3, period = 60 }

[[ratelimits]]
name = "LIMIT_OVERALL"
namespace_id = "1002"
simple = { limit = 30, period = 60 }
