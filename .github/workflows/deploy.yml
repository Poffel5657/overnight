# Baut die Seite aus main und legt für jeden Tag eine spielbare Kopie unter day/NNN/ an.
name: Deploy

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    # Fest gewählt: Playwright (für den Zeitraffer) unterstützt nicht jedes neue ubuntu-latest.
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
      deployments: read
    environment:
      name: github-pages
      url: ${{ steps.first.outputs.page_url || steps.second.outputs.page_url || steps.third.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - name: Seite und Archiv zusammenstellen
        run: |
          set -euo pipefail
          mkdir -p _site
          cp -r index.html style.css src content fonts timelapse _site/
          for tag in $(git tag -l 'day-[0-9][0-9][0-9]'); do
            dir="_site/day/${tag#day-}"
            mkdir -p "$dir"
            # Nur Pfade, die es in diesem Tag schon gab (fonts/ zum Beispiel erst seit dem Terminal-Look).
            git archive "$tag" $(git ls-tree --name-only "$tag" index.html style.css src content fonts) | tar -x -C "$dir"
          done
      # Zeitraffer: ein Bild pro archivierter Nacht. Scheitert das, geht die Seite trotzdem raus,
      # dann mit der leeren Platzhalterliste.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Zeitraffer aufnehmen
        continue-on-error: true
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium
          node .github/scripts/timelapse.mjs _site
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site
      # Pages lehnt einen Deploy ab, solange ein älterer als "in Arbeit" gilt. Dank concurrency läuft
      # kein anderer Deploy von uns, ein solcher Eintrag ist also verwaist und darf abgebrochen werden.
      - id: first
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        continue-on-error: true
      - if: steps.first.outcome == 'failure'
        name: Verwaiste Deploys abbrechen und warten
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          for sha in $(gh api "repos/$REPO/deployments?environment=github-pages&per_page=5" --jq '.[].sha' | sort -u); do
            [ "$sha" = "$GITHUB_SHA" ] || gh api -X POST "repos/$REPO/pages/deployments/$sha/cancel" --silent || true
          done
          sleep 90
      - id: second
        if: steps.first.outcome == 'failure'
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        continue-on-error: true
      - if: steps.second.outcome == 'failure'
        name: Noch einmal abbrechen und länger warten
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          for sha in $(gh api "repos/$REPO/deployments?environment=github-pages&per_page=5" --jq '.[].sha' | sort -u); do
            [ "$sha" = "$GITHUB_SHA" ] || gh api -X POST "repos/$REPO/pages/deployments/$sha/cancel" --silent || true
          done
          sleep 180
      - id: third
        if: steps.second.outcome == 'failure'
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
