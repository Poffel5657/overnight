# Baut die Seite aus main und legt für jeden Tag eine spielbare Kopie unter day/NNN/ an.
name: Deploy

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - name: Seite und Archiv zusammenstellen
        run: |
          set -euo pipefail
          mkdir -p _site
          cp -r index.html style.css src content _site/
          for tag in $(git tag -l 'day-[0-9][0-9][0-9]'); do
            dir="_site/day/${tag#day-}"
            mkdir -p "$dir"
            git archive "$tag" index.html style.css src content | tar -x -C "$dir"
          done
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site
      - id: pages
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
