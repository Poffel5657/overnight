# Deployt den Worker neu, wenn sich etwas ändert, das er benutzt. Seit der gemeinsamen Welt (Tag 6) rechnet
# der Worker die Kreaturen mit src/game.js und content/, deshalb muss er nach jeder Nacht mitziehen.
# Braucht die Secrets CLOUDFLARE_API_TOKEN (Vorlage "Edit Cloudflare Workers") und CLOUDFLARE_ACCOUNT_ID.
# Der Nachtlauf merged mit dem GITHUB_TOKEN, das löst kein push aus: nightly-gate.yml startet diesen Workflow deshalb selbst.
name: Deploy worker

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['worker/**', 'src/game.js', 'content/**']

permissions: {}

concurrency:
  group: worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      # Nur die Worker-Tests, sie brauchen keinen Browser. Scheitern sie, bleibt der alte Worker stehen.
      - name: Worker-Tests
        run: |
          npm ci --ignore-scripts
          npx playwright test tests/smoke/worker.spec.js tests/smoke/chat-worker.spec.js tests/smoke/presence-worker.spec.js
      - name: Deploy
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.158.0 deploy
