# Prüft den PR des Nachtlaufs und veröffentlicht ihn automatisch.
# pull_request_target: Die Definition kommt immer von main, ein PR kann seine Prüfung nicht umschreiben.
# Fremder Code läuft nur im Job "test", dort ohne Schreibrechte und ohne Secrets.
name: Nightly gate

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]

permissions: {}

concurrency:
  group: nightly-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  gate:
    # Nur Branches aus diesem Repo, also keine Fork-PRs. Pushen können hier nur Chris und der Nachtlauf.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.event.pull_request.head.ref, 'claude/day-') &&
      github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
    outputs:
      day: ${{ steps.check.outputs.day }}
      big_issue: ${{ steps.check.outputs.big_issue }}
    steps:
      - id: check
        name: Pfade, Pflichtdateien und Tagesnummer prüfen
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }

          [[ "$HEAD_REF" =~ ^claude/day-([0-9]{3})$ ]] || fail "Branch muss claude/day-NNN heißen."
          day="${BASH_REMATCH[1]}"

          behind=$(gh api "repos/$REPO/compare/$BASE_REF...$HEAD_SHA" --jq .behind_by)
          [ "$behind" = "0" ] || fail "Branch ist nicht auf dem aktuellen main aufgebaut."

          # Keine privaten Adressen in die öffentliche Historie.
          bad=$(gh api --paginate "repos/$REPO/pulls/$PR/commits?per_page=100" --jq '.[] | .commit.author.email, .commit.committer.email' | grep -vE '@users\.noreply\.github\.com$|^noreply@github\.com$' || true)
          [ -z "$bad" ] || fail "Commit ohne Noreply-Adresse."

          gh api --paginate "repos/$REPO/pulls/$PR/files?per_page=100" --jq '.[]' > files.jsonl
          jq -r '.filename, (.previous_filename // empty)' files.jsonl | sort -u > paths.txt

          protected='^(\.github/|CLAUDE\.md$|worker/|tests/smoke/|src/config\.js$|src/suggest\.js$|src/vote\.js$|src/event\.js$|src/rate\.js$|src/chat\.js$|src/presence\.js$|tools/|about/|timelapse/|package\.json$|package-lock\.json$|playwright\.config\.js$)'
          if grep -E "$protected" paths.txt; then fail "PR ändert geschützte Pfade."; fi

          grep -qx 'PLAN.md' paths.txt || fail "PLAN.md wurde nicht aktualisiert."
          grep -qx 'CHRONICLE.md' paths.txt || fail "CHRONICLE.md wurde nicht aktualisiert."
          grep -qx 'content/chronicle.js' paths.txt || fail "content/chronicle.js wurde nicht aktualisiert."

          lines=$(jq -s '[.[] | select(.filename | test("^(content/|tests/)|\\.md$") | not) | .additions + .deletions] | add // 0' files.jsonl)
          big_issue=""
          if [ "$lines" -gt 1000 ]; then
            # Großer Umbau: nur mit Freigabe von Chris auf einem big-change-Issue, und höchstens 3000 Zeilen.
            [ "$lines" -le 3000 ] || fail "$lines geänderte Zeilen außerhalb von content/, tests/ und Doku (absolute Grenze 3000)."
            gh api "repos/$REPO/pulls/$PR" --jq '.body // ""' > body.txt
            big_issue=$(grep -oE '^Big-Change: #[0-9]+' body.txt | grep -oE '[0-9]+' | head -1 || true)
            [ -n "$big_issue" ] || fail "$lines Zeilen (Grenze 1000) und keine Zeile Big-Change: #N in der PR-Beschreibung."
            gh api "repos/$REPO/issues/$big_issue" --jq 'select(.state == "open" and .pull_request == null and ([.labels[].name] | index("big-change"))) | .number' > issue.txt
            [ -s issue.txt ] || fail "Issue #$big_issue ist kein offenes big-change-Issue."
            # Nur ein eigener Kommentar von Chris zählt, nicht einer, den der Nachtlauf über eine GitHub-App schreibt.
            gh api --paginate "repos/$REPO/issues/$big_issue/comments?per_page=100" --jq '.[] | select(.user.login == "Poffel5657" and .author_association == "OWNER" and .performed_via_github_app == null and (.body | test("^\\s*ja\\b"; "i"))) | .id' > approved.txt
            [ -s approved.txt ] || fail "Issue #$big_issue hat keine Freigabe von Chris."
            echo "Freigabe gefunden: Issue #$big_issue, $lines Zeilen."
          fi
          echo "big_issue=$big_issue" >> "$GITHUB_OUTPUT"

          gh api "repos/$REPO/contents/content/chronicle.js?ref=$HEAD_SHA" -H 'Accept: application/vnd.github.raw' > chronicle.js
          last=$(grep -oE '\bday: *[0-9]+' chronicle.js | tail -1 | grep -oE '[0-9]+')
          [ "$((10#$day))" = "$last" ] || fail "Letzter Chronik-Eintrag ist Tag $last, Branch ist Tag $day."

          echo "day=$day" >> "$GITHUB_OUTPUT"

  test:
    needs: gate
    # Fest gewählt: Playwright unterstützt nicht jedes neue ubuntu-latest.
    runs-on: ubuntu-24.04
    # Hängt etwas (zum Beispiel ein langsamer Paketspiegel), scheitert die Nacht sichtbar statt stundenlang zu warten.
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: npm test

  publish:
    needs: [gate, test]
    # Notschalter: Repo-Variable AUTO_MERGE auf false setzen, dann bleibt jeder PR liegen.
    if: vars.AUTO_MERGE != 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      statuses: write
      actions: write
      issues: write
    steps:
      - name: Mergen, taggen, Deploy starten
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          DAY: ${{ needs.gate.outputs.day }}
          BIG_ISSUE: ${{ needs.gate.outputs.big_issue }}
        run: |
          set -euo pipefail
          # Die Schutzregel auf main verlangt genau diesen Status, und nur von GitHub Actions.
          gh api "repos/$REPO/statuses/$HEAD_SHA" -f state=success -f context=overnight-gate -f description="Gate und Tests bestanden" > /dev/null
          # Rebase statt Squash: Squash würde den Klarnamen und die Mail des Kontos als Autor eintragen.
          gh pr merge "$PR" --repo "$REPO" --rebase --delete-branch --match-head-commit "$HEAD_SHA"
          merged=$(gh api "repos/$REPO/commits/main" --jq .sha)
          gh api "repos/$REPO/git/refs" -f ref="refs/tags/day-$DAY" -f sha="$merged" > /dev/null
          gh workflow run deploy.yml --repo "$REPO" --ref main
          # Eine Freigabe gilt nur einmal.
          if [ -n "$BIG_ISSUE" ]; then gh issue close "$BIG_ISSUE" --repo "$REPO" --comment "Gebaut an Tag $DAY."; fi
