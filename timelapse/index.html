<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; base-uri 'none'; form-action 'none'">
  <title>Overnight Timelapse</title>
  <meta name="description" content="Every night of Overnight, the whole world on one map.">
  <link rel="icon" href="../icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../style.css">
  <link rel="stylesheet" href="timelapse.css">
  <script type="module" src="timelapse.js"></script>
</head>
<body>
  <main class="shell">
    <header class="statusbar">
      <h1 class="brand">OVERNIGHT // TIMELAPSE</h1>
      <a class="button back" href="../">Back to today</a>
    </header>

    <figure class="frame window">
      <h2 class="window-title">[ PLAYBACK ]</h2>
      <div class="atlas-frame"><canvas id="atlas" role="img"></canvas></div>
      <figcaption>
        <p id="caption-title" class="caption-title"></p>
        <p id="caption-text"></p>
        <a id="caption-play" href="../">Play this version</a>
      </figcaption>
    </figure>

    <div class="controls">
      <button id="prev" aria-label="Previous night">◀</button>
      <input id="slider" type="range" min="0" max="0" value="0" aria-label="Night">
      <button id="next" aria-label="Next night">▶</button>
      <button id="play">Play</button>
    </div>

    <p id="empty" class="fineprint" hidden>No maps yet. They are drawn every time the world changes.</p>
    <p class="hint">Arrow keys move through the nights. Every map shows the whole world as it stood that day, every place side by side, joined by its doors.</p>
  </main>
</body>
</html>
